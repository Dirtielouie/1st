<title>Aligned Elements ROI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column, inputs then a result card. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --ink: #12262b;
  --muted: #5b6f74;
  --line: #d5e0e2;
  --accent: #0b6e72;
  --accent-soft: #dcefee;
  --bad: #b3261e;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a1d; --surface: #13252a; --ink: #e3eef0; --muted: #93a9ae; --line: #25403f;
    --accent: #4fc2bf; --accent-soft: #163a3b; --bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a1d; --surface: #13252a; --ink: #e3eef0; --muted: #93a9ae; --line: #25403f;
  --accent: #4fc2bf; --accent-soft: #163a3b; --bad: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-display); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 24px; }
h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 800; font-stretch: 112%; line-height: 1.1; text-wrap: balance; }
h2 { margin: 0; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { margin: 6px 0 0; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) 9.5em; gap: 12px; align-items: center; }
.field label { font-size: .92rem; }
.box { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
.box input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--ink); padding: 7px 8px; text-align: right; font: 600 .95rem var(--font-data); font-variant-numeric: tabular-nums; }
.box span { padding-right: 9px; color: var(--muted); font-size: .85rem; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }

.result { background: var(--accent-soft); border-color: transparent; gap: 16px; }
.big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.roi { font: 800 clamp(3rem, 12vw, 4.4rem)/1 var(--font-display); font-stretch: 120%; color: var(--accent); font-variant-numeric: tabular-nums; }
.roi.neg { color: var(--bad); }
.big span { color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.kpis div { display: grid; }
.kpis b { font: 700 1.3rem var(--font-data); font-variant-numeric: tabular-nums; }
.kpis span { font-size: .82rem; color: var(--muted); }
.note { margin: 0; font-size: .85rem; color: var(--muted); }
@media (max-width: 420px) { .field { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
</style>

<div class="wrap">
  <header>
    <h1>Calculateur de ROI Aligned Elements</h1>
    <p class="lede">Ce que coûte un DHF dans Word et Excel, et ce qu'Aligned Elements fait gagner sur 3 ans.</p>
  </header>

  <section class="card">
    <h2>Aujourd'hui</h2>
    <div class="field"><label for="team">Personnes dans l'équipe</label><div class="box"><input type="number" id="team" value="10" min="0"></div></div>
    <div class="field"><label for="salary">Salaire annuel moyen</label><div class="box"><input type="number" id="salary" value="85000" min="0" step="1000"><span>€</span></div></div>
    <div class="field"><label for="hours">Heures de documentation par semaine et par personne</label><div class="box"><input type="number" id="hours" value="2" min="0" step="0.5"><span>h</span></div></div>
    <div class="field"><label for="audit">Coûts d'audit et de conformité par an</label><div class="box"><input type="number" id="audit" value="33200" min="0" step="100"><span>€</span></div></div>
  </section>

  <section class="card">
    <h2>Avec Aligned Elements</h2>
    <div class="field"><label for="license">Licences et hébergement par an</label><div class="box"><input type="number" id="license" value="13500" min="0" step="100"><span>€</span></div></div>
    <div class="field"><label for="setup">Mise en place (une fois)</label><div class="box"><input type="number" id="setup" value="7900" min="0" step="100"><span>€</span></div></div>
    <div class="field"><label for="gain">Temps de documentation gagné</label><div class="box"><input type="number" id="gain" value="35" min="0" max="100"><span>%</span></div></div>
    <div class="field"><label for="auditGain">Économie sur les audits</label><div class="box"><input type="number" id="auditGain" value="40" min="0" max="100"><span>%</span></div></div>
  </section>

  <section class="card result" aria-live="polite">
    <h2>Résultat sur 3 ans</h2>
    <div class="big"><div class="roi" id="roi"></div><span>de retour sur investissement</span></div>
    <div class="kpis">
      <div><b id="net"></b><span>économisés sur 3 ans</span></div>
      <div><b id="payback"></b><span>pour rentabiliser</span></div>
    </div>
    <p class="note" id="detail"></p>
  </section>
</div>

<script>
(() => {
  const ids = ["team", "salary", "hours", "audit", "license", "setup", "gain", "auditGain"];
  const v = id => +document.getElementById(id).value || 0;
  const eur = x => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(x);

  function update() {
    // 1 700 h travaillées par an, 52 semaines documentées.
    const docCost = v("team") * v("hours") * 52 * (v("salary") / 1700);
    const yearly = docCost * v("gain") / 100 + v("audit") * v("auditGain") / 100;
    const cost3 = v("license") * 3 + v("setup");
    const net = yearly * 3 - cost3;
    const roi = cost3 > 0 ? net / cost3 : 0;
    const monthly = (yearly - v("license")) / 12;
    const months = monthly > 0 ? Math.ceil(v("setup") / monthly) : null;

    const roiEl = document.getElementById("roi");
    roiEl.textContent = `${Math.round(roi * 100)} %`;
    roiEl.classList.toggle("neg", net < 0);
    document.getElementById("net").textContent = eur(net);
    document.getElementById("payback").textContent = months === null ? "jamais" : `${months} mois`;
    document.getElementById("detail").textContent =
      `La documentation manuelle coûte ${eur(docCost)} par an. Aligned Elements fait gagner ${eur(yearly)} par an, pour ${eur(v("license"))} de licences par an et ${eur(v("setup"))} de mise en place.`;
  }

  ids.forEach(id => document.getElementById(id).addEventListener("input", update));
  update();
})();
</script>
